<style>
  :root {
    --content-offset-y: -20px;
    --canvas-offset-y: 60px;
    --canvas-content-nudge-y: -8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
                Cantarell, "Helvetica Neue", sans-serif;
  }

  #canvas-wrap {
    transform: translateY(var(--canvas-offset-y));
    pointer-events: none;
  }

  #content-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(var(--content-offset-y));
  }

  #canvas {
    width: 480px;
    height: 250px;
    display: block;
    transform: translateY(var(--canvas-content-nudge-y));
    pointer-events: none;
  }

  #footer-line a {
    color: inherit;
    text-decoration: none;
  }

  #footer-line {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
</style>

<body style="margin:0; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
  <div id="content-wrap">
    <div id="canvas-wrap" style="width:100%; height:20vh; display:flex; align-items:center; justify-content:center;">
      <canvas id="canvas" width="224" height="224"></canvas>
    </div>

    <p id="footer-line" style="color:rgba(0,0,0,0.6);">
      <a id="blog-link" href="#">blog</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
</body>

<script>
  let model;
  const canvas = document.getElementById('canvas');
  const modelType = 'full';

  const BLOG_URL = 'https://zaforf.github.io/blog';

  function initFooterLinks() {
    const blogLink = document.getElementById('blog-link');
    blogLink.href = BLOG_URL;
  }

  async function loadModel() {
    model = await tf.loadGraphModel(modelType + '_decoder/model.json');
    console.log("Model loaded");
  }

  function renderImageFromTensor(tensor) {
    const imageTensor = tf.tidy(() => tensor.squeeze().mul(255).clipByValue(0, 255).cast('int32'));
    tf.browser.toPixels(imageTensor, canvas);
    imageTensor.dispose();
  }

  async function predictFromLatent(z0, z1) {
    const z = tf.tensor2d([[z0, z1]]);
    const output = model.predict(z);
    renderImageFromTensor(output);
    z.dispose();
    output.dispose();
  }

  document.addEventListener('mousemove', (e) => {
    if (!model) return;

    let min_x, max_x, min_y, max_y;
    if (modelType == 'small') {
      min_x = -10; max_x = 1;
      min_y = -2.5; max_y = 9;
    } else if (modelType == 'smaller') {
      min_x = -1.3; max_x = 7.5;
      min_y = -7; max_y = 7.5;
    } else if (modelType == 'full') {
      min_x = -3; max_x = 3;
      min_y = -3; max_y = 3;
    }
    const z0 = ((e.clientX - 0) / window.innerWidth) * (max_x - min_x) + min_x;
    const z1 = ((e.clientY - 0) / window.innerHeight) * (max_y - min_y) + min_y;
    predictFromLatent(z0, z1);
  });

  initFooterLinks();

  loadModel().then(() => {
    predictFromLatent(0, 0);
  });
</script>
