<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage.">
  <title>zaforf</title>
  <style>
    :root { --ink: #111; --muted: rgba(17,17,17,.5); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 32px, 560px); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; text-align: center; transform: translateY(-50px); }
    .name-art { width: min(480px, 92vw); height: 180px; display: block; margin-top: 30px; margin-bottom: 18px; transform: translateY(75px); }
    .fallback-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .portrait { display: block; width: 340px; height: 453px; margin-top: 0; object-fit: cover; object-position: 50% 31%; }
    nav { margin-top: 30px; display: flex; align-items: baseline; gap: 14px; color: rgba(0,0,0,.6); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
    nav a, nav button { color: inherit; text-decoration: none; }
    nav a:hover, nav a:focus-visible, nav button:hover, nav button:focus-visible { color: rgba(0,0,0,.75); text-decoration: underline; text-underline-offset: 3px; }
    nav button { padding: 0; border: 0; background: none; cursor: pointer; color: rgba(0,0,0,.6); font-family: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; text-transform: inherit; letter-spacing: inherit; vertical-align: baseline; }
    .dot { color: rgba(17,17,17,.2); }
    @media (max-width: 480px) { .name-art { width: min(480px, 94vw); height: 160px; margin-top: 24px; margin-bottom: 14px; transform: translateY(75px); } .portrait { width: 280px; height: 373px; } }
  </style>
</head>
<body>
  <main>
    <canvas id="name-art" class="name-art" width="224" height="224" aria-label="Generated name art"></canvas>
    <img class="portrait" src="IMG_6217.JPG" alt="Portrait at the Golden Gate Bridge">
    <nav aria-label="Personal links">
      <a href="https://github.com/zaforf">github</a><span class="dot">·</span><a href="https://zaforf.github.io/blog">blog</a><span class="dot">·</span><button type="button" id="contact-link">contact</button>
    </nav>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script>
    const canvas = document.getElementById('name-art'); let model; let tx = .5; let ty = .5; let x = .5; let y = .5; let queued = false;
    function render(tensor) { const pixels = tf.tidy(() => tensor.squeeze().mul(255).clipByValue(0,255).cast('int32')); tf.browser.toPixels(pixels, canvas); pixels.dispose(); }
    function draw() { queued = false; x += (tx - x) * .12; y += (ty - y) * .12; if (model) { const z = tf.tensor2d([[x * 6 - 3, y * 6 - 3]]); const output = model.predict(z); render(output); z.dispose(); output.dispose(); } if (Math.abs(tx-x) > .001 || Math.abs(ty-y) > .001) requestDraw(); }
    function requestDraw() { if (!queued) { queued = true; requestAnimationFrame(draw); } }
    document.addEventListener('pointermove', event => { tx = event.clientX / innerWidth; ty = event.clientY / innerHeight; requestDraw(); });
    document.getElementById('contact-link').addEventListener('click', () => alert('[first name].[last name]@gmail.com'));
    tf.loadGraphModel('full_decoder/model.json').then(loaded => { model = loaded; draw(); });
  </script>
</body>
</html>
